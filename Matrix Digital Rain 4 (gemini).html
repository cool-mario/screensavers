<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Matrix Rain</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Courier New', Courier, monospace;
        }
        canvas {
            display: block;
        }
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #0F0;
            background: rgba(0, 0, 0, 0.75);
            padding: 15px;
            border: 1px solid #0F0;
            border-radius: 5px;
            pointer-events: none;
            user-select: none;
            font-size: 14px;
            line-height: 1.5;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.3);
            transition: border-color 0.3s, box-shadow 0.3s;
            display: none; /* Changed to none so HUD is hidden by default */
        }
    </style>
</head>
<body>

    <div id="hud">
        <strong>CONTROLS:</strong><br>
        [ + ] / [ - ] : Speed Up / Slow Down<br>
        [ C ]         : Cycle Color Mode<br>
        [ [ ] / [ ] ] : Decrease / Increase Density<br>
        [ ` ]         : Toggle HUD Display<br>
        <hr style="border: 0; border-top: 1px solid #0F0; margin: 10px 0;">
        <span id="stats">Speed: 30ms | Color: Gamer RGB | Density: Max</span>
    </div>

    <canvas id="matrixCanvas"></canvas>

    <script>
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');
        const hud = document.getElementById('hud');
        const stats = document.getElementById('stats');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ";
        const fontSize = 16;
        let columns = canvas.width / fontSize;
        const rainDrops = [];

        for (let x = 0; x < columns; x++) {
            rainDrops[x] = 1;
        }

        // --- INTERACTIVE STATE VARIABLES ---
        let frameDelay = 95;       
        let densityLevel = 5;     
        
        // 1. Gamer RGB rearranged to position 0 (Default). New colors appended.
        const colorModes = ['Gamer RGB', 'Classic Green', 'Cyberpunk Blue', 'Neon Pink', 'Matrix Amber', 'Knowt teal', 'Discord blurple'];
        let colorIndex = 0;
        let rgbHue = 0;           
        let showHUD = false; // Changed to false to match the CSS default hidden state

        function updateHUD() {
            let currentModeName = colorModes[colorIndex];
            let densityText = densityLevel === 5 ? "Max" : densityLevel === 1 ? "Min" : `${densityLevel}/5`;
            
            stats.innerHTML = `Speed Delay: ${frameDelay}ms | Color: ${currentModeName} | Density: ${densityText}`;
            
            // 3. Accent color assignments for the HUD borders to match the new themes
            let themeColor = '#0F0';
            if (colorModes[colorIndex] === 'Cyberpunk Blue') themeColor = '#00FFFF';
            if (colorModes[colorIndex] === 'Neon Pink') themeColor = '#FF00FF';
            if (colorModes[colorIndex] === 'Matrix Amber') themeColor = '#FFB000';
            if (colorModes[colorIndex] === 'Knowt teal') themeColor = '#50d2c2';
            if (colorModes[colorIndex] === 'Discord blurple') themeColor = '#5865F2';
            if (colorModes[colorIndex] === 'Gamer RGB') themeColor = `hsl(${rgbHue % 360}, 100%, 50%)`;

            hud.style.color = themeColor;
            hud.style.borderColor = themeColor;
            hud.style.boxShadow = `0 0 10px ${themeColor}`;
            const hr = hud.querySelector('hr');
            if (hr) hr.style.borderTop = `1px solid ${themeColor}`;
        }

        let lastTime = 0;

        function draw() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.font = fontSize + 'px monospace';
            rgbHue += 1; 

            const step = 6 - densityLevel;

            for (let i = 0; i < rainDrops.length; i++) {
                if (i % step !== 0) continue;

                const text = alphabet.charAt(Math.floor(Math.random() * alphabet.length));
                const x = i * fontSize;
                const y = rainDrops[i] * fontSize;

                if (Math.random() > 0.98) {
                    ctx.fillStyle = '#FFF'; 
                } else {
                    // 2. Rendering assignments within our character loop engine
                    switch(colorModes[colorIndex]) {
                        case 'Gamer RGB':
                            ctx.fillStyle = `hsl(${(i * 8 + rgbHue) % 360}, 100%, 50%)`;
                            break;
                        case 'Classic Green':
                            ctx.fillStyle = '#0F0';
                            break;
                        case 'Cyberpunk Blue':
                            ctx.fillStyle = '#00FFFF';
                            break;
                        case 'Neon Pink':
                            ctx.fillStyle = '#FF00FF';
                            break;
                        case 'Matrix Amber':
                            ctx.fillStyle = '#FFB000';
                            break;
                        case 'Knowt teal':
                            ctx.fillStyle = '#50d2c2'; // Assigned hex
                            break;
                        case 'Discord blurple':
                            ctx.fillStyle = '#5865F2'; // Assigned hex
                            break;
                    }
                }

                ctx.fillText(text, x, y);

                if (y > canvas.height && Math.random() > 0.975) {
                    rainDrops[i] = 0;
                }
                rainDrops[i]++;
            }

            // Continuously repaint the HUD borders if Gamer RGB mode is spinning actively
            if (colorModes[colorIndex] === 'Gamer RGB' && showHUD) {
                updateHUD();
            }
        }

        function engineLoop(timestamp) {
            requestAnimationFrame(engineLoop);
            const delta = timestamp - lastTime;
            
            if (delta >= frameDelay) {
                lastTime = timestamp - (delta % frameDelay);
                draw();
            }
        }

        requestAnimationFrame(engineLoop);

        // --- KEYBOARD CONTROLS ---
        window.addEventListener('keydown', (e) => {
            const key = e.key;

            if (key === '`') {
                showHUD = !showHUD;
                hud.style.display = showHUD ? 'block' : 'none';
            }

            if (key === '+' || key === '=') {
                frameDelay = Math.max(5, frameDelay - 5); 
            } else if (key === '-') {
                frameDelay = Math.min(150, frameDelay + 5); 
            }
            else if (key === 'c' || key === 'C') {
                colorIndex = (colorIndex + 1) % colorModes.length;
            }
            else if (key === ']') {
                densityLevel = Math.min(5, densityLevel + 1);
            } else if (key === '[') {
                densityLevel = Math.max(1, densityLevel - 1);
            }

            if (showHUD) updateHUD();
        });

        // Generate text string profiles prior to engine launch
        updateHUD();

        window.addEventListener('resize', () => {
            columns = canvas.width / fontSize;
            while (rainDrops.length < columns) {
                rainDrops.push(1);
            }
        });
    </script>
</body>
</html>
